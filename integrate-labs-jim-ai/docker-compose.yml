version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: integrate-labs-jim-ai_web_1
      APP_PORT: 18789

  web:
    image: ghcr.io/getumbrel/hermes-agent-umbrel:v2026.7.30@sha256:9690d13fcf2f3040e4f2577c76aaae57f80441c010c77642e33aec3c3b304e25
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/hermes:/opt/data
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PORT: "18789"
      HERMES_UMBREL_APP_PROXY_AUTH: "1"
      HERMES_TUI_DIR: "/app/umbrel-tui"
      HERMES_UPSTREAM_TUI_ENTRY: "/opt/hermes/ui-tui/dist/entry.js"
      HERMES_GATEWAY_BOOTSTRAP_STATE: "running"
    command: ["gateway", "run"]

  webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - web
    ports:
      - "18792:8787"
    volumes:
      - ${APP_DATA_DIR}/data/hermes:/home/hermeswebui/.hermes
    environment:
      HERMES_HOME: /home/hermeswebui/.hermes
      HERMES_WEBUI_HOST: "0.0.0.0"
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      HERMES_WEBUI_EXTENSION_DIR: /home/hermeswebui/.hermes/webui-extensions
      HERMES_WEBUI_EXTENSION_MANIFEST: extensions.json
      HERMES_WEBUI_CHAT_BACKEND: gateway
      HERMES_WEBUI_GATEWAY_BASE_URL: http://integrate-labs-jim-ai_web_1:8642
      HERMES_WEBUI_GATEWAY_USE_RUNS_API: "true"
      WANTED_UID: "1000"
      WANTED_GID: "1000"
