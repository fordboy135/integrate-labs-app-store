tagline: No-code database for leads, deals, and pipelines
description: >-
  NocoDB is a no-code database platform — an open alternative to Airtable that
  runs entirely on your own box.


  Built to be the operating base for a real-estate team: track leads, deals,
  showings, and transaction pipelines in grid, kanban, calendar, and form views.
  Share forms publicly to capture leads straight into your database, and invite
  your team with granular permissions.


  ## Highlights

    - **Spreadsheet-simple** - Grid, kanban, gallery, calendar, and form views.

    - **Lead capture forms** - Publish forms that write straight into your tables.

    - **Automations & webhooks** - Trigger actions when records change.

    - **API built in** - Every table gets a REST API for integrations.


  Curated for Integrate Labs client boxes.
